<div
    style="min-height: 100vh; background: var(--bg-main); padding: 2rem; display: flex; flex-direction: column; align-items: center; justify-content: center;">
    <div style="text-align: center; margin-bottom: 3rem;">
        <h1 style="font-size: 2.5rem; margin-bottom: 0.5rem; color: var(--text-main);">Welcome to HangingHome</h1>
        <p style="color: var(--text-sub); font-size: 1.1rem;">Please select a branch to view the menu and order.</p>
    </div>

    <div *ngIf="isLoading" style="display: flex; justify-content: center; padding: 3rem;">
        <div class="loading-state">Loading stores...</div>
    </div>

    <div class="store-grid" *ngIf="!isLoading && stores.length > 0"
        style="display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 1.5rem; width: 100%; max-width: 1000px;">
        <div *ngFor="let store of stores" class="store-card" [routerLink]="['/kiosk', store.id]"
            style="background: var(--surface); border: 1px solid var(--border-soft); border-radius: 16px; padding: 1.5rem; cursor: pointer; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);">

            <div style="display: flex; align-items: center; gap: 1rem; margin-bottom: 1rem;">
                <div
                    style="width: 48px; height: 48px; border-radius: 12px; background: rgba(46, 125, 50, 0.1); color: var(--primary); display: flex; align-items: center; justify-content: center;">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                        <polyline points="9 22 9 12 15 12 15 22"></polyline>
                    </svg>
                </div>
                <div>
                    <h3 style="margin: 0; font-size: 1.25rem;">{{ store.name }}</h3>
                </div>
            </div>

            <p style="color: var(--text-sub); margin: 0; font-size: 0.875rem; line-height: 1.5;">
                {{ store.description || 'Visit us for the best experience in town.' }}
            </p>

            <div style="margin-top: 1.5rem; display: flex; justify-content: flex-end;">
                <span
                    style="color: var(--primary); font-weight: 500; display: flex; align-items: center; gap: 0.25rem; font-size: 0.875rem;">
                    View Menu
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                        <polyline points="12 5 19 12 12 19"></polyline>
                    </svg>
                </span>
            </div>
        </div>
    </div>

    <div *ngIf="!isLoading && stores.length === 0"
        style="text-align: center; padding: 4rem; background: var(--surface); border-radius: 16px; border: 1px dashed var(--border-soft); width: 100%; max-width: 600px;">
        <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"
            style="color: var(--text-muted); margin-bottom: 1rem;">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="12" y1="8" x2="12" y2="12"></line>
            <line x1="12" y1="16" x2="12.01" y2="16"></line>
        </svg>
        <h3 style="margin: 0 0 0.5rem 0;">No Active Stores</h3>
        <p style="color: var(--text-sub); margin: 0;">We currently have no locations available for ordering.</p>
    </div>

    <style>
        .store-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05) !important;
            border-color: var(--primary) !important;
        }
    </style>
</div>
