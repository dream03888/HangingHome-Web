<div class="card-manager-container">
    <header class="page-header">
        <div class="title-section">
            <h1>{{ 'CONTROL_PANEL.CREDIT_CARDS' | translate }}</h1>
            <p class="subtitle">{{ 'CREDIT_CARDS.SUBTITLE' | translate }}</p>
        </div>
        <div class="action-section">
            <button class="btn btn-primary" (click)='addCompany()'>
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                {{ 'COMMON.ADD' | translate }}
            </button>
        </div>
    </header>

    <div class="cards-grid">
        <div class="company-card card" *ngFor="let company of companies" [class.inactive]="!company.is_active">
            <div class="card-header">
                <div class="icon-box">
                    <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="1" y="4" width="22" height="16" rx="2" ry="2"></rect><line x1="1" y1="10" x2="23" y2="10"></line></svg>
                </div>
                <div class="status-toggle">
                    <label class="switch">
                        <input type="checkbox" [checked]="company.is_active" (change)="toggleStatus(company)">
                        <span class="slider round"></span>
                    </label>
                </div>
            </div>
            
            <div class="card-body">
                <h3 class="company-name">{{company.name}}</h3>
                <div class="fee-badge">
                    <span class="label">FEE:</span>
                    <span class="value">{{company.fee_pct}}%</span>
                </div>
                
                <div class="contact-details">
                    <div class="detail-row" *ngIf="company.contact_name">
                        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                        <span>{{company.contact_name}}</span>
                    </div>
                    <div class="detail-row" *ngIf="company.phone">
                        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path></svg>
                        <span>{{company.phone}}</span>
                    </div>
                    <div class="detail-row" *ngIf="company.email">
                        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg>
                        <span>{{company.email}}</span>
                    </div>
                    <div class="detail-row address" *ngIf="company.address">
                        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path><circle cx="12" cy="10" r="3"></circle></svg>
                        <span>{{company.address}}</span>
                    </div>
                </div>
            </div>

            <div class="card-footer">
                <button class="btn-text" (click)="editCompany(company)">{{ 'COMMON.EDIT' | translate }}</button>
                <button class="btn-text delete" (click)="deleteCompany(company.id)">{{ 'COMMON.REMOVE' | translate }}</button>
            </div>
        </div>

        <div class="empty-card" *ngIf="companies.length === 0 && !isLoading">
            <p>{{ 'COMMON.NO_DATA' | translate }}</p>
        </div>
    </div>
</div>
