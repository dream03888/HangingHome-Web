<div class="page-container">
    <div class="page-header">
        <div class="header-content">
            <button class="btn-icon header-back" (click)="goBack()" [title]="'COMMON.BACK' | translate">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="19" y1="12" x2="5" y2="12"></line>
                    <polyline points="12 19 5 12 12 5"></polyline>
                </svg>
            </button>
            <div>
                <h2 class="page-title">{{ isEditMode ? ('STORE.EDIT_TITLE' | translate) : ('STORE.CREATE_TITLE' |
                    translate) }}</h2>
            </div>
        </div>
    </div>

    <div class="form-card">
        <form [formGroup]="storeForm" (ngSubmit)="onSubmit()">

            <!-- Store Name -->
            <div class="form-row">
                <div class="form-group flex-1">
                    <label for="name">{{ 'STORE.NAME' | translate }} (TH) <span class="required">*</span></label>
                    <input type="text" id="name" formControlName="name" class="form-control"
                        [class.is-invalid]="storeForm.get('name')?.invalid && storeForm.get('name')?.touched"
                        placeholder="e.g. สาขาสุขุมวิท">
                    <div class="error-feedback"
                        *ngIf="storeForm.get('name')?.invalid && storeForm.get('name')?.touched">
                        <span *ngIf="storeForm.get('name')?.errors?.['required']">Store name is required</span>
                        <span *ngIf="storeForm.get('name')?.errors?.['minlength']">Store name must be at least 3
                            characters</span>
                    </div>
                </div>
                <div class="form-group flex-1">
                    <label for="nameEn">{{ 'STORE.NAME' | translate }} (EN)</label>
                    <input type="text" id="nameEn" formControlName="nameEn" class="form-control"
                        placeholder="e.g. Sukhumvit Branch">
                </div>
            </div>

            <!-- Store Description -->
            <div class="form-group">
                <label for="description">{{ 'STORE.DESC' | translate }} <span
                        class="text-muted">(Optional)</span></label>
                <textarea id="description" formControlName="description" class="form-control" rows="4"></textarea>
            </div>

            <!-- Stock Management Toggle (SuperAdmin Only) -->
            <div class="form-group" style="margin-top: 1rem;" *ngIf="authService.isSuperAdmin()">
                <label class="toggle-container"
                    style="display: flex; align-items: center; cursor: pointer; padding: 1rem; border: 1px solid var(--border-soft); border-radius: 12px; background: var(--surface);">
                    <div class="toggle-info" style="flex: 1;">
                        <span style="font-weight: 500; display: block; margin-bottom: 0.25rem;">Enable Stock Management
                            (Phase 3)</span>
                        <span style="font-size: 0.875rem; color: var(--text-sub);">Opt-in inventory tracking, recipe
                            BOMs, and raw material alerts for this store.</span>
                    </div>
                    <label class="toggle-switch ml-4">
                        <input type="checkbox" formControlName="isStockEnabled">
                        <span class="slider"></span>
                    </label>
                </label>
            </div>

            <!-- Actions -->
            <div class="form-actions">
                <button type="button" class="btn-secondary" (click)="goBack()">{{ 'COMMON.CANCEL' | translate
                    }}</button>
                <button *ngIf="authService.hasPermission('manage_store')" type="submit" class="btn-primary"
                    [disabled]="storeForm.invalid">
                    {{ isEditMode ? ('COMMON.SAVE' | translate) : ('COMMON.CREATE' | translate) }}
                </button>
            </div>

        </form>
    </div>
</div>
