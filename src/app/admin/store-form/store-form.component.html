<div class="page-container">
    <div class="page-header">
        <div class="header-content">
            <button class="btn-icon header-back" (click)="goBack()" [title]="'COMMON.BACK' | translate">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="19" y1="12" x2="5" y2="12"></line>
                    <polyline points="12 19 5 12 12 5"></polyline>
                </svg>
            </button>
            <div>
                <h2 class="page-title">{{ isEditMode ? ('STORE.EDIT_TITLE' | translate) : ('STORE.CREATE_TITLE' |
                    translate) }}</h2>
            </div>
        </div>
    </div>

    <div class="form-card">
        <form [formGroup]="storeForm" (ngSubmit)="onSubmit()">

            <!-- Store Name -->
            <div class="form-row">
                <div class="form-group flex-1">
                    <label for="name">{{ 'STORE.NAME' | translate }} (TH) <span class="required">*</span></label>
                    <input type="text" id="name" formControlName="name" class="form-control"
                        [class.is-invalid]="storeForm.get('name')?.invalid && storeForm.get('name')?.touched"
                        placeholder="e.g. สาขาสุขุมวิท">
                    <div class="error-feedback"
                        *ngIf="storeForm.get('name')?.invalid && storeForm.get('name')?.touched">
                        <span *ngIf="storeForm.get('name')?.errors?.['required']">Store name is required</span>
                        <span *ngIf="storeForm.get('name')?.errors?.['minlength']">Store name must be at least 3
                            characters</span>
                    </div>
                </div>
                <div class="form-group flex-1">
                    <label for="nameEn">{{ 'STORE.NAME' | translate }} (EN)</label>
                    <input type="text" id="nameEn" formControlName="nameEn" class="form-control"
                        placeholder="e.g. Sukhumvit Branch">
                </div>
                <div class="form-group flex-1">
                    <label for="store_code">{{ 'STORE.CODE' | translate }} <span class="required">*</span></label>
                    <input type="text" id="store_code" formControlName="store_code" class="form-control"
                        placeholder="e.g. HG01">
                    <small class="text-muted">{{ 'STORE.CODE_HINT' | translate }}</small>
                </div>
            </div>

            <!-- Store Description -->
            <div class="form-group">
                <label for="description">{{ 'STORE.DESC_OPTIONAL' | translate }}</label>
                <textarea id="description" formControlName="description" class="form-control" rows="4"></textarea>
            </div>

            <!-- Stock Management Toggle (SuperAdmin Only) -->
            <div class="form-group" style="margin-top: 1rem;" *ngIf="authService.isSuperAdmin()">
                <label class="toggle-container"
                    style="display: flex; align-items: center; cursor: pointer; padding: 1rem; border: 1px solid var(--border-soft); border-radius: 12px; background: var(--surface);">
                    <div class="toggle-info" style="flex: 1;">
                        <span style="font-weight: 500; display: block; margin-bottom: 0.25rem;">{{ 'STORE.ENABLE_STOCK' | translate }}</span>
                        <span style="font-size: 0.875rem; color: var(--text-sub);">{{ 'STORE.STOCK_HINT' | translate }}</span>
                    </div>
                    <label class="toggle-switch ml-4">
                        <input type="checkbox" formControlName="isStockEnabled">
                        <span class="slider"></span>
                    </label>
                </label>
            </div>

            <!-- Table Service (Phase 43) -->
            <div class="form-group" style="margin-top: 1rem;">
                <label class="toggle-container"
                    style="display: flex; align-items: center; cursor: pointer; padding: 1rem; border: 1px solid var(--border-soft); border-radius: 12px; background: var(--surface);">
                    <div class="toggle-info" style="flex: 1;">
                        <span style="font-weight: 500; display: block; margin-bottom: 0.25rem;">{{ 'STORE.ENABLE_TABLE' | translate }}</span>
                        <span style="font-size: 0.875rem; color: var(--text-sub);">{{ 'STORE.TABLE_HINT' | translate }}</span>
                    </div>
                    <label class="toggle-switch ml-4">
                        <input type="checkbox" formControlName="allowTables">
                        <span class="slider"></span>
                    </label>
                </label>
            </div>

            <div class="form-group" *ngIf="storeForm.get('allowTables')?.value" style="margin-top: 0.5rem; padding-left: 1rem;">
                <label for="tableCount">{{ 'STORE.TABLE_COUNT' | translate }}</label>
                <input type="number" id="tableCount" formControlName="tableCount" class="form-control" style="max-width: 150px;" placeholder="e.g. 10">
                <small class="text-muted">{{ 'STORE.TABLE_COUNT_HINT' | translate }}</small>
            </div>

            <div class="form-group" style="margin-top: 1.5rem;">
                <label>{{ 'STORE.SIGNAGE_FILE' | translate }}</label>
                <div class="file-upload-container" style="margin-top: 0.5rem;">
                    <input type="file" (change)="onSignageFileSelected($event)" accept="image/*,video/*" class="form-control" style="margin-bottom: 0.5rem;">
                    <small class="text-muted">{{ 'STORE.SIGNAGE_FILE_HINT' | translate }}</small>
                    
                    <div class="preview-container" *ngIf="signagePreview" style="margin-top: 1rem; max-width: 300px; border-radius: 8px; overflow: hidden; border: 1px solid var(--border-soft);">
                        <img *ngIf="!signagePreview.includes('video')" [src]="signagePreview" style="width: 100%; display: block;" alt="Signage Preview">
                        <video *ngIf="signagePreview.includes('video')" [src]="signagePreview" controls style="width: 100%; display: block;"></video>
                    </div>
                </div>
            </div>

            <!-- Actions -->
            <div class="form-actions">
                <button type="button" class="btn-secondary" (click)="goBack()">{{ 'COMMON.CANCEL' | translate
                    }}</button>
                <button *ngIf="authService.hasPermission('manage_store')" type="submit" class="btn-primary"
                    [disabled]="storeForm.invalid">
                    {{ isEditMode ? ('COMMON.SAVE' | translate) : ('COMMON.CREATE' | translate) }}
                </button>
            </div>

        </form>
    </div>
</div>
