<div class="page-container">
    <div class="page-header">
        <div class="header-content">
            <button class="btn-icon header-back" (click)="goBack()" [title]="'COMMON.BACK' | translate">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="19" y1="12" x2="5" y2="12"></line>
                    <polyline points="12 19 5 12 12 5"></polyline>
                </svg>
            </button>
            <div>
                <h2 class="page-title">{{ isEditMode ? ('STORE.EDIT_TITLE' | translate) : ('STORE.CREATE_TITLE' |
                    translate) }}</h2>
            </div>
        </div>
    </div>

    <div class="form-card">
        <form [formGroup]="storeForm" (ngSubmit)="onSubmit()">

            <!-- Store Name -->
            <div class="form-group">
                <label for="name">{{ 'STORE.NAME' | translate }} <span class="required">*</span></label>
                <input type="text" id="name" formControlName="name" class="form-control"
                    [class.is-invalid]="storeForm.get('name')?.invalid && storeForm.get('name')?.touched"
                    placeholder="e.g. Premium Coffee Shop Sukhumvit">
                <div class="error-feedback" *ngIf="storeForm.get('name')?.invalid && storeForm.get('name')?.touched">
                    <span *ngIf="storeForm.get('name')?.errors?.['required']">Store name is required</span>
                    <span *ngIf="storeForm.get('name')?.errors?.['minlength']">Store name must be at least 3
                        characters</span>
                </div>
            </div>

            <!-- Store Description -->
            <div class="form-group">
                <label for="description">{{ 'STORE.DESC' | translate }} <span
                        class="text-muted">(Optional)</span></label>
                <textarea id="description" formControlName="description" class="form-control" rows="4"></textarea>
            </div>

            <!-- Actions -->
            <div class="form-actions">
                <button type="button" class="btn-secondary" (click)="goBack()">{{ 'COMMON.CANCEL' | translate
                    }}</button>
                <button *ngIf="authService.hasPermission('manage_store')" type="submit" class="btn-primary"
                    [disabled]="storeForm.invalid">
                    {{ isEditMode ? ('COMMON.SAVE' | translate) : ('COMMON.CREATE' | translate) }}
                </button>
            </div>

        </form>
    </div>
</div>
