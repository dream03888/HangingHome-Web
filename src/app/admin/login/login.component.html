<div class="login-wrapper">
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <div class="logo-circle">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                        class="lucide lucide-lock">
                        <rect width="18" height="11" x="3" y="11" rx="2" ry="2" />
                        <path d="M7 11V7a5 5 0 0 1 10 0v4" />
                    </svg>
                </div>
                <h2>Back-Home Management</h2>
                <p>Sign in to manage your stores.</p>
            </div>

            <div class="login-body">

                <div class="error-alert" *ngIf="errorMessage">
                    {{ errorMessage }}
                </div>

                <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="login-form">
                    <div class="form-group">
                        <label for="username">Username</label>
                        <input type="text" id="username" formControlName="username" class="form-control"
                            placeholder="Enter your username">
                    </div>

                    <div class="form-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" formControlName="password" class="form-control"
                            placeholder="Enter your password">
                    </div>

                    <button type="submit" class="btn-primary w-full mt-4" [disabled]="loginForm.invalid">
                        Sign In
                    </button>
                </form>

                <div class="hint-text">
                    <p><strong>Demo Accounts (Pass: password):</strong></p>
                    <p>superadmin, storeadmin1, storeadmin2</p>
                </div>
            </div>
        </div>
    </div>
</div>
